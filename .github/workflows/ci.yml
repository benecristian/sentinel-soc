name: SENTINEL SOC CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-database-password-12345
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint & format check (Ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Static type check (Mypy strict)
        run: mypy app
      - name: Run unit, integration, API & migration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sentinel:ci-only-database-password-12345@localhost:5432/sentinel_test
        run: pytest --cov=app --cov-report=term-missing -v

  frontend:
    name: Frontend (TypeScript, Vitest, Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run component & workflow tests
        run: npm test
      - name: Production build
        run: npm run build
